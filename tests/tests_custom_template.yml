# SPDX-License-Identifier: MIT
---
- name: Ensure that the role runs with default parameters
  hosts: all
  tasks:
    # The custom configuration reports to a directory not every aide package ships
    - name: Ensure the report directory exists
      file:
        path: /var/log/aide
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Run the role
      include_tasks: tasks/run_role_with_clear_facts.yml
      vars:
        aide_config_template: files/aide-custom.conf.j2
        aide_install: true
        aide_init: true
    - name: Check header for ansible_managed, fingerprint
      include_tasks: tasks/check_header.yml
      vars:
        __file: /etc/aide.conf
        __fingerprint: system_role:aide

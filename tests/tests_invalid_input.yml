---
# Verify meta/argument_specs.yml and tasks/assert_role_vars.yml reject bad
# parameters. Each block runs the role expecting failure; rescue records
# that outcome.
- name: Verify invalid parameters are rejected
  hosts: all
  tasks:
    - name: Run invalid input tests
      block:
        # ====================================================
        # Section 1: Verify role works with valid defaults
        # ====================================================
        - name: Run role with valid defaults
          ansible.builtin.include_role:
            name: linux-system-roles.aide

        # ====================================================
        # Section 2: argument_specs validation (Ansible 2.11+)
        # ====================================================
        - name: Run argument specs validation tests
          when: ansible_version.full is version("2.11", ">=")
          block:
            - name: Argument specs reject non-boolean aide_init
              block:
                - name: Run role with non-boolean aide_init
                  ansible.builtin.include_role:
                    name: linux-system-roles.aide
                  vars:
                    aide_init: "not_a_bool"
              rescue:
                - name: Mark invalid aide_init type rejected
                  ansible.builtin.set_fact:
                    __invalid_input_aide_init_type_failed: true

            - name: Assert invalid aide_init type was rejected
              ansible.builtin.assert:
                that:
                  - __invalid_input_aide_init_type_failed | default(false)
                fail_msg: >-
                  argument_specs should reject aide_init with a non-boolean
                  value

            - name: Argument specs reject non-boolean aide_fetch_db
              block:
                - name: Run role with non-boolean aide_fetch_db
                  ansible.builtin.include_role:
                    name: linux-system-roles.aide
                  vars:
                    aide_fetch_db: "not_a_bool"
              rescue:
                - name: Mark invalid aide_fetch_db type rejected
                  ansible.builtin.set_fact:
                    __invalid_input_aide_fetch_db_type_failed: true

            - name: Assert invalid aide_fetch_db type was rejected
              ansible.builtin.assert:
                that:
                  - >-
                    __invalid_input_aide_fetch_db_type_failed
                    | default(false)
                fail_msg: >-
                  argument_specs should reject aide_fetch_db with a
                  non-boolean value

            - name: Argument specs reject non-boolean aide_check
              block:
                - name: Run role with non-boolean aide_check
                  ansible.builtin.include_role:
                    name: linux-system-roles.aide
                  vars:
                    aide_check: "not_a_bool"
              rescue:
                - name: Mark invalid aide_check type rejected
                  ansible.builtin.set_fact:
                    __invalid_input_aide_check_type_failed: true

            - name: Assert invalid aide_check type was rejected
              ansible.builtin.assert:
                that:
                  - __invalid_input_aide_check_type_failed | default(false)
                fail_msg: >-
                  argument_specs should reject aide_check with a non-boolean
                  value

            - name: Argument specs reject non-boolean aide_update
              block:
                - name: Run role with non-boolean aide_update
                  ansible.builtin.include_role:
                    name: linux-system-roles.aide
                  vars:
                    aide_update: "not_a_bool"
              rescue:
                - name: Mark invalid aide_update type rejected
                  ansible.builtin.set_fact:
                    __invalid_input_aide_update_type_failed: true

            - name: Assert invalid aide_update type was rejected
              ansible.builtin.assert:
                that:
                  - __invalid_input_aide_update_type_failed | default(false)
                fail_msg: >-
                  argument_specs should reject aide_update with a non-boolean
                  value

        # ====================================================
        # Section 3: assert_role_vars validation (all versions)
        # ====================================================
        - name: Assert rejects aide_config_template as integer
          block:
            - name: Run role with aide_config_template as integer
              ansible.builtin.include_role:
                name: linux-system-roles.aide
              vars:
                aide_config_template: 42
          rescue:
            - name: Mark aide_config_template integer rejected
              ansible.builtin.set_fact:
                __invalid_input_aide_config_template_int_failed: true

        - name: Assert aide_config_template as integer was rejected
          ansible.builtin.assert:
            that:
              - >-
                __invalid_input_aide_config_template_int_failed
                | default(false)
            fail_msg: >-
              assert_role_vars should reject aide_config_template when
              given an integer instead of null or a string

        - name: Assert rejects aide_cron_check as string
          block:
            - name: Run role with aide_cron_check as string
              ansible.builtin.include_role:
                name: linux-system-roles.aide
              vars:
                aide_cron_check: "not_a_bool"
          rescue:
            - name: Mark aide_cron_check string rejected
              ansible.builtin.set_fact:
                __invalid_input_aide_cron_check_str_failed: true

        - name: Assert aide_cron_check as string was rejected
          ansible.builtin.assert:
            that:
              - __invalid_input_aide_cron_check_str_failed | default(false)
            fail_msg: >-
              assert_role_vars should reject aide_cron_check when given
              a string instead of null or a boolean

        - name: Assert rejects aide_cron_check as integer
          block:
            - name: Run role with aide_cron_check as integer
              ansible.builtin.include_role:
                name: linux-system-roles.aide
              vars:
                aide_cron_check: 42
          rescue:
            - name: Mark aide_cron_check integer rejected
              ansible.builtin.set_fact:
                __invalid_input_aide_cron_check_int_failed: true

        - name: Assert aide_cron_check as integer was rejected
          ansible.builtin.assert:
            that:
              - __invalid_input_aide_cron_check_int_failed | default(false)
            fail_msg: >-
              assert_role_vars should reject aide_cron_check when given
              an integer instead of null or a boolean

      always:
        - name: Clear test facts
          ansible.builtin.set_fact:
            __invalid_input_aide_init_type_failed:
            __invalid_input_aide_fetch_db_type_failed:
            __invalid_input_aide_check_type_failed:
            __invalid_input_aide_update_type_failed:
            __invalid_input_aide_config_template_int_failed:
            __invalid_input_aide_cron_check_str_failed:
            __invalid_input_aide_cron_check_int_failed:
          tags: tests::cleanup
